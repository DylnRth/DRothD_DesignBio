<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Massimo Vignelli Biography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar sm:navbar-expand fg-2 theNav navFade">
      <div class="container-fluid">
        <a class="navbar-brand me-5" href="#">Navbar</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="navbar-nav">
              <li class="nav-item me-5">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item me-5">
                <a class="nav-link" href="#">Features</a>
              </li>
              <li class="nav-item me-5">
                <a class="nav-link" href="#">Pricing</a>
              </li>
              <li class="nav-item me-5">
                <a class="nav-link disabled" aria-disabled="true">Disabled</a>
              </li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>

  <!-- Main Hero Container -->
  <main class="hero-container">
    
    <!-- Left Column: Graphic & Text -->
    <div class="hero-left">
      <div class="graphic-wrapper">
        <img class="subwayLines" src="img/subwaylines.png" alt="Subway Lines Design">
      </div>
      <div class="text-wrapper">
        <h1 class="hero-title">Massimo Vignelli</h1>
        <p class="hero-subtitle">A Biography of a Modern Designer</p>
      </div>
    </div>

    <!-- Right Column: Stripes & Photo -->
    <div class="hero-right">
      <!-- Vertical Stripes -->
      <div class="vertical-stripes">
        <div class="vertical1"></div>
        <div class="vertical2"></div>
      </div>
      <!-- Portrait Photo -->
      <img class="massimo-photo" src="img/Massimo Vignelli Design Website Layout (1).svg" alt="Massimo Vignelli">
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
