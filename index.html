<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Massimo Vignelli Biography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navFade">
    <div class="container-fluid px-5 pt-3">
      <a class="navbar-brand fw-bold me-4" href="#">Navbar</a>
      <div class="navbar-nav">
        <a class="nav-link active me-4" href="#">Home</a>
        <a class="nav-link me-4" href="#">Features</a>
        <a class="nav-link me-4" href="#">Pricing</a>
        <a class="nav-link disabled" href="#">Disabled</a>
      </div>
    </div>
  </nav>

  <!-- Main Hero Container -->
  <main class="hero-container">
    
    <!-- Left Column: Graphic & Text -->
    <div class="hero-left">
      <div class="graphic-wrapper">
        <img class="subwayLines" src="img/subwaylines.png" alt="Subway Lines Design">
      </div>
      <div class="text-wrapper">
        <h1 class="hero-title">Massimo Vignelli</h1>
        <p class="hero-subtitle">A Biography of a Modern Designer</p>
      </div>
    </div>

    <!-- Right Column: Stripes & Photo -->
    <div class="hero-right">
      <!-- Vertical Stripes -->
      <div class="vertical-stripes">
        <div class="vertical1"></div>
        <div class="vertical2"></div>
      </div>
      <!-- Portrait Photo -->
      <img class="massimo-photo" src="img/Massimo Vignelli Design Website Layout (1).svg" alt="Massimo Vignelli">
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
